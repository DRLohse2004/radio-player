# Prüft jeden Push und Pull Request: Typen, Unit-Tests und Build.
# Windows-Teile (Bluetooth, WASAPI, portable exe) laufen hier nicht.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Electron-Binary wird für Typprüfung und Tests nicht gebraucht
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
